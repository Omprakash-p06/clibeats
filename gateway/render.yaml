services:
  - type: web
    name: clibeats-gateway
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: PROXY_STREAMING
        value: true
    healthCheckPath: /health
