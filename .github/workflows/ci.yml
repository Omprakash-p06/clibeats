name: CLIBeats CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Build, Lint & Test Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATEWAY_URL: "http://localhost:8080/"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint code style check
        run: ./gradlew ktlintCheck --continue

      - name: Run Detekt static analysis
        run: ./gradlew detekt --continue

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.html

  gateway-quality-and-test:
    name: Provider Gateway Build, TypeCheck & Vitest Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install Gateway Dependencies
        run: |
          cd gateway
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd gateway
          npm run check

      - name: Run Vitest Unit, Integration, Contract, Property & Architecture Tests
        run: |
          cd gateway
          npm test

      - name: Validate OpenAPI Contract Matches Route Schemas
        run: |
          cd gateway
          npm run openapi:validate

      - name: Build Docker Container
        run: |
          cd gateway
          docker build -t clibeats-provider-gateway:latest .
