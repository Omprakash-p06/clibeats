name: Release

# Push a tag like `v2.0.0` to build a signed APK and publish a GitHub Release.
# Required repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Without them the job fails: a debug-signed APK can't update existing installs (in-app updater).
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A release published by hand (e.g. with an APK that was tested on a device) is left untouched.
      - name: Skip if the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.existing.outputs.skip != 'true'

      - uses: actions/setup-java@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.existing.outputs.skip != 'true'

      - name: Decode keystore
        if: steps.existing.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::KEYSTORE_BASE64 is not set. Add the signing secrets or publish the release by hand."
            exit 1
          fi

      - name: Test
        if: steps.existing.outputs.skip != 'true'
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      - name: Build release APK
        if: steps.existing.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode from the version (2.0.0 -> 20000) so every release upgrades cleanly over the last.
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/CLIBeats-v$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          # Release notes + a copyable checksum block.
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo "## SHA-256 checksum"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo 'Verify: `sha256sum -c SHA256SUMS.txt` (Linux/macOS) or `Get-FileHash CLIBeats-v'"$VERSION"'.apk` (Windows).'
          } > "$RUNNER_TEMP/release-body.md"

      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.skip != 'true'
        with:
          name: CLIBeats ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
