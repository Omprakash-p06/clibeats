name: Download stats

# Once a day (and after each release) counts APK downloads and redraws the README badge and charts.
# The data lives on the separate `stats` branch so main's history doesn't get a commit every day.

on:
  schedule:
    - cron: '17 3 * * *'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Check out the stats branch (created on first run)
        run: |
          git fetch origin stats || true
          if git rev-parse --verify -q origin/stats >/dev/null; then
            git worktree add stats-out origin/stats
            git -C stats-out switch -c stats
          else
            git worktree add --orphan -b stats stats-out
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Count downloads and draw charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/download-stats.mjs "${{ github.repository }}" stats-out

      - name: Commit if anything changed
        working-directory: stats-out
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "stats: downloads $(date -u +%F)"
          git push origin stats
